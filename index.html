/* Layout: Linienraster | Routenbauer | Karte (wie die Skizze); auf dem Handy: Karte, Route, Linien untereinander */
/* Max' ZVV-Vorgaben */
:root{
  --zvv-blau:#0479CC; --zvv-blau-dunkel:#03558F; --gruen:#239C36;
  --text:#636363; --text-dunkel:#525252; --schwarz:#000000; --weiss:#FFFFFF;
  --hintergrund:#F2F2F2; --hintergrund-hell:#F9FAFB; --schatten:rgba(0,0,0,.12); --overlay:rgba(0,0,0,.5);
  --schrift:"Barlow Semi Condensed",Arial,Helvetica,sans-serif;
  --text-klein:14px; --text-normal:19px; --text-mittel:22px; --titel-klein:32px; --titel:38px; --titel-gross:46px;
  --rund-klein:4px; --rund:6px; --kreis:50%;
  --abstand-1:4px; --abstand-2:8px; --abstand-3:12px; --abstand-4:16px; --abstand-5:20px; --abstand-6:24px;
  /* Rollen im Spiel, aus den Vorgaben abgeleitet */
  --blau:var(--zvv-blau); --blau-tief:var(--zvv-blau-dunkel); --blau-hell:#E6F1FA;
  --bg:var(--weiss); --karte:var(--weiss); --flaeche:var(--hintergrund); --stark:var(--schwarz); --grau:var(--text);
  --linie:#DEDEDE; --start:var(--gruen); --ziel:#D3302A; --gold:#E8A800;
  --k-a:#EEF3E6; --k-b:#F6EDEA; --k-c:#E8F0F7; --k-d:#F4F1E2; --grenze:#8A8A8A; --wasser:#C4E0F4; --fluss:#7DB8E3;
  --sperr:#9A9A9A; --punkt:#8C8C8C; --bus-strich:#525252;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blau:#3D9BE0;--blau-tief:#0479CC;--blau-hell:#12324D;--bg:#111417;--karte:#1B1F23;--flaeche:#262B30;--text:#C9CDD1;--text-dunkel:#DADDE0;--stark:#FFFFFF;
  --grau:#A3A9AF;--linie:#33393F;--schatten:rgba(0,0,0,.5);--k-a:#1F2A22;--k-b:#2B2325;--k-c:#1D2631;--k-d:#2A281E;--grenze:#757B81;--wasser:#173A59;--fluss:#2F6C9C;
  --sperr:#62686E;--punkt:#70767C;--bus-strich:#C9CDD1;color-scheme:dark}}
:root[data-theme="dark"]{
  --blau:#3D9BE0;--blau-tief:#0479CC;--blau-hell:#12324D;--bg:#111417;--karte:#1B1F23;--flaeche:#262B30;--text:#C9CDD1;--text-dunkel:#DADDE0;--stark:#FFFFFF;
  --grau:#A3A9AF;--linie:#33393F;--schatten:rgba(0,0,0,.5);--k-a:#1F2A22;--k-b:#2B2325;--k-c:#1D2631;--k-d:#2A281E;--grenze:#757B81;--wasser:#173A59;--fluss:#2F6C9C;
  --sperr:#62686E;--punkt:#70767C;--bus-strich:#C9CDD1;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--text-normal)/1.35 var(--schrift);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--blau);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blau);outline-offset:2px}
.kopf{background:var(--blau);color:var(--weiss);display:flex;align-items:center;gap:var(--abstand-3);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kopf h1{margin:0;font-size:var(--text-mittel);font-weight:700;flex:1;letter-spacing:.01em}
.kopf .zaehler{font-size:var(--text-klein);opacity:.9}
.kopf button{background:var(--weiss);color:var(--zvv-blau);border:0;border-radius:var(--rund);padding:var(--abstand-2) var(--abstand-3);font-weight:600;font-size:var(--text-klein)}
.buehne{display:grid;grid-template-columns:250px 370px minmax(0,1fr);gap:var(--abstand-4);
  padding-block:var(--abstand-4);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  height:calc(100% - 96px);min-height:560px}
.spalte{display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto}
.karte{background:var(--karte);border-radius:var(--rund);padding:var(--abstand-4);box-shadow:0 1px 4px var(--schatten)}
.label{font-size:var(--text-klein);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dunkel);font-weight:600;margin-bottom:var(--abstand-2)}
.hinweis{color:var(--text);font-size:var(--text-klein);margin:0}

/* Linienraster */
.raster{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--abstand-2)}
.kachel{aspect-ratio:1;border:0;border-radius:var(--rund);background:var(--flaeche);display:flex;align-items:center;justify-content:center;padding:0}
.kachel:hover{background:var(--blau-hell)}
.kachel.an{background:var(--blau-hell);box-shadow:inset 0 0 0 2.5px var(--blau)}
.kachel.fuss svg{width:24px;height:24px}
.kachel:disabled{opacity:.35;cursor:default}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 6px;border-radius:var(--rund-klein);
  background:var(--bg-l);color:var(--fg-l);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;line-height:1}
.badge.bus{border-radius:14px}
.badge.rand{box-shadow:inset 0 0 0 1.5px var(--schwarz)}
.badge.fussb{background:var(--flaeche);color:var(--stark);min-width:40px}
.badge.fussb svg{width:15px;height:15px}

/* Routenbauer wie in der Skizze */
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.schritt{display:grid;grid-template-columns:48px 1fr;gap:var(--abstand-3);align-items:center;min-height:38px}
.schritt .ort{font-weight:600;color:var(--stark);min-width:0}
.schritt .ort small{display:block;font-weight:400;color:var(--text);font-size:var(--text-klein)}
.pfeil{display:grid;grid-template-columns:48px 1fr;gap:var(--abstand-3);height:22px}
.pfeil span{grid-column:2;width:2px;background:var(--grenze);margin-left:14px;position:relative}
.pfeil span::after{content:"";position:absolute;bottom:-1px;left:-4px;border:5px solid transparent;border-top-color:var(--grenze);border-bottom:0}
.punktmarke{width:14px;height:14px;border-radius:var(--kreis);justify-self:center}
.punktmarke.start{background:var(--start)}
.punktmarke.ziel{background:var(--ziel)}
.schritt.offen .ort{color:var(--text);font-weight:500}
.schritt.ziel-erreicht .ort{color:var(--start)}
.aufgabe{background:var(--blau-hell);color:var(--text-dunkel);border-radius:var(--rund);padding:var(--abstand-3);font-size:var(--text-normal)}
.auswahl{display:flex;flex-direction:column;gap:2px;margin-top:var(--abstand-2)}
.auswahl h3{font-size:var(--text-klein);color:var(--text-dunkel);margin:var(--abstand-2) 0 2px;font-weight:600}
.halt{display:flex;justify-content:space-between;gap:8px;text-align:left;width:100%;background:none;border:0;border-radius:var(--rund);padding:var(--abstand-1) var(--abstand-2);color:var(--stark)}
.halt:hover{background:var(--blau-hell)}
.halt.ist-ziel{background:#FFF3BF;color:var(--schwarz);font-weight:600}
.halt small{color:var(--text);font-size:var(--text-klein);align-self:center}
.halt.ist-ziel small{color:#5b4a00}
.knopfreihe{display:flex;gap:var(--abstand-2);flex-wrap:wrap}
.knopf{flex:1 1 120px;border:1.5px solid var(--blau);background:var(--karte);color:var(--blau);border-radius:var(--rund);padding:var(--abstand-2) var(--abstand-3);font-weight:600}
.knopf:hover{background:var(--blau-hell)}
.knopf.voll{background:var(--blau);color:var(--weiss)}
.knopf.voll:hover{background:var(--blau-tief)}
.knopf:disabled{opacity:.4;cursor:default}
.resultat{text-align:center}
.sterne{font-size:28px;letter-spacing:6px;color:var(--gold)}
.sterne .aus{color:var(--linie)}
.gross{font-size:var(--titel-klein);font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.gut{color:var(--gruen)} .mittel{color:#C27A00} .schlecht{color:var(--ziel)}
.vergleich{display:grid;grid-template-columns:1fr 1fr;gap:var(--abstand-3);text-align:left;margin-top:10px}
.vergleich .z{font-size:var(--text-mittel);font-weight:700;color:var(--stark);font-variant-numeric:tabular-nums}
.minileg{display:flex;align-items:center;gap:var(--abstand-2);font-size:var(--text-klein);color:var(--stark);margin-top:5px;min-width:0}
.minileg span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Karte */
.kartenfeld{position:relative;background:var(--hintergrund-hell);border-radius:var(--rund);overflow:hidden;min-height:0;box-shadow:0 1px 4px var(--schatten)}
#karte{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#karte.zieht{cursor:grabbing}
.kreis{stroke:var(--grenze);stroke-width:1.2;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
.k-a{fill:var(--k-a)}.k-b{fill:var(--k-b)}.k-c{fill:var(--k-c)}.k-d{fill:var(--k-d)}
.see{fill:var(--wasser)}
.fluss{fill:none;stroke:var(--fluss);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.sperr{fill:url(#schraffur);pointer-events:none}
.schraffur-strich{stroke:var(--sperr);stroke-width:18;opacity:.45}
.kreisnr{font-weight:700;fill:var(--text-dunkel);opacity:.55;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-size:420px}
.pkt{fill:var(--punkt);opacity:.75}
.wahlpkt{fill:var(--karte);stroke-width:3;vector-effect:non-scaling-stroke;cursor:pointer}
.wahlpkt:hover{fill:var(--blau-hell)}
.treffer{fill:transparent;cursor:pointer}
.leg-rand{fill:none;stroke:var(--karte);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.leg{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.leg.fuss{stroke:var(--stark);stroke-dasharray:2 7}
.best{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:10 7;opacity:.9}
.marke{stroke:var(--karte);stroke-width:3;vector-effect:non-scaling-stroke}
.marke.start{fill:var(--start)} .marke.ziel{fill:var(--ziel)} .marke.hier{fill:var(--blau)}
.schild{font-weight:700;paint-order:stroke;stroke:var(--karte);stroke-width:4px;stroke-linejoin:round;fill:var(--stark);pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:var(--rund);border:0;background:var(--karte);box-shadow:0 1px 4px var(--schatten);font-size:22px;font-weight:600;color:var(--zvv-blau)}
.legende{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;background:var(--karte);border-radius:var(--rund);padding:var(--abstand-1) var(--abstand-3);font-size:var(--text-klein);
  box-shadow:0 1px 4px var(--schatten);max-width:calc(100% - 20px)}
.legende i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legende i.sp{border-radius:2px;background:repeating-linear-gradient(45deg,var(--sperr) 0 2px,transparent 2px 5px)}
.tipp{position:absolute;pointer-events:none;background:var(--stark);color:var(--karte);font-size:var(--text-klein);font-weight:600;padding:var(--abstand-1) var(--abstand-2);border-radius:var(--rund);white-space:nowrap;transform:translate(-50%,-140%)}
.quelle{font-size:var(--text-klein);color:var(--text);margin:0}

/* Karte im Stil einer ÖV-Karte: helles Land, weisse Strassen, blaue Haltestellen, A/B-Nadeln */
:root{--land:#E7EBD8;--stadt:#EEEEE6;--strasse:#F9F9F4;--strasse-rand:#E2E2D8;--ortname:#8A8A80;--ring:#1E1E1E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--land:#1A1F1A;--stadt:#202421;--strasse:#3A3F3B;--strasse-rand:#2A2F2B;--ortname:#8F958F;--ring:#E6E6E6}}
:root[data-theme="dark"]{--land:#1A1F1A;--stadt:#202421;--strasse:#3A3F3B;--strasse-rand:#2A2F2B;--ortname:#8F958F;--ring:#E6E6E6}
.kartenfeld{background:var(--land)}
.land{fill:var(--land)} .stadtflaeche{fill:var(--stadt)}
.grenze{fill:none;stroke:var(--grenze);stroke-width:1.2;stroke-dasharray:6 3 1.5 3;vector-effect:non-scaling-stroke;opacity:.8}
.strasse-rand{fill:none;stroke:var(--strasse-rand);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.strasse{fill:none;stroke:var(--strasse);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ortname{fill:var(--ortname);text-anchor:middle;dominant-baseline:central;font-weight:500;paint-order:stroke;stroke:var(--stadt);stroke-width:3px;pointer-events:none}
.pkt{fill:var(--zvv-blau);opacity:1}
.ring{fill:var(--weiss);stroke:var(--ring);stroke-width:3;vector-effect:non-scaling-stroke}
.pin{fill:var(--zvv-blau);stroke:var(--weiss);stroke-width:2;vector-effect:non-scaling-stroke}
.pin-text{fill:var(--weiss);font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.punktmarke{width:26px;height:26px;background:var(--zvv-blau)!important;color:var(--weiss);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center}
.lg-pin{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--zvv-blau);color:var(--weiss);font-size:12px;align-items:center;justify-content:center;margin-right:4px;font-weight:600}
.legende i.hs{border-radius:2px;background:var(--zvv-blau);width:9px;height:9px}

/* Leaflet-Karte */
.kartenfeld #karte{position:absolute;inset:0;width:auto;height:auto;cursor:grab}
.leaflet-container{font-family:var(--schrift);background:var(--land)}
.kacheln{filter:saturate(.85) brightness(1.01)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kacheln{filter:saturate(.4) brightness(.62) contrast(1.05)}}
:root[data-theme="dark"] .kacheln{filter:saturate(.4) brightness(.62) contrast(1.05)}
.leaflet-container .schraffur-strich{stroke:var(--sperr);stroke-width:1.5;opacity:.4}
.mit-kacheln .leaflet-container .schraffur-strich{stroke:#5A5A5A;opacity:.5}
.hs{background:var(--zvv-blau);border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.ortname.nachbar span{color:var(--grenze);font-size:14px;letter-spacing:.1em}
.ortname span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:var(--ortname);font-size:13px;font-weight:500;letter-spacing:.06em;
  text-shadow:0 0 3px var(--stadt),0 0 3px var(--stadt),0 0 3px var(--stadt)}
.wahl span{display:block;width:16px;height:16px;margin:3px;border-radius:50%;background:var(--weiss);border:3.5px solid;box-sizing:border-box;transition:transform .12s;box-shadow:0 0 0 1.5px rgba(0,0,0,.45)}
.wahl:hover span{transform:scale(1.3)}
.wahl.ist-ziel span{background:#FFE14D}
.pin-wrap{position:relative}
.pin{position:absolute;left:-19px;top:-64px;width:38px;height:38px;border-radius:50%;background:var(--zvv-blau);border:2px solid var(--weiss);color:var(--weiss);
  font-weight:600;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin::after{content:"";position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:13px solid var(--zvv-blau)}
.pin-ring{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--weiss);border:3.5px solid var(--ring);box-sizing:border-box}
.pin-name,.du b{position:absolute;white-space:nowrap;font-weight:700;font-size:15px;color:var(--stark);
  text-shadow:0 0 3px var(--karte),0 0 3px var(--karte),0 0 3px var(--karte),0 0 3px var(--karte)}
.pin-name{left:24px;top:-56px}
.du{position:relative}
.du .kern{position:absolute;inset:1px;border-radius:50%;background:var(--zvv-blau);border:3px solid var(--weiss);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.du .puls{position:absolute;inset:-10px;border-radius:50%;background:var(--zvv-blau);opacity:.25}
@media (prefers-reduced-motion:no-preference){.du .puls{animation:puls2 1.8s ease-out infinite}}
@keyframes puls2{from{transform:scale(.5);opacity:.45}to{transform:scale(1.4);opacity:0}}
.du b{left:24px;top:-1px}
.leaflet-touch .leaflet-bar,.leaflet-bar{border:0;box-shadow:0 1px 4px var(--schatten);border-radius:var(--rund)}
.leaflet-bar a,.leaflet-touch .leaflet-bar a{width:40px;height:40px;line-height:40px;font-size:22px;color:var(--zvv-blau);background:var(--karte);border-bottom-color:var(--linie)}
.leaflet-bar a:hover{background:var(--blau-hell)}
.ganz-knopf{width:40px;height:40px;border:0;border-radius:var(--rund);background:var(--karte);color:var(--zvv-blau);box-shadow:0 1px 4px var(--schatten);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.leaflet-tooltip{font-family:var(--schrift);font-size:var(--text-klein);font-weight:600}
.leaflet-control-attribution{font-size:11px}
.legende{z-index:800;bottom:22px}
@media (max-width:1180px){
  .buehne{grid-template-columns:370px minmax(0,1fr);grid-template-rows:auto 1fr}
  .linienspalte{grid-column:1;grid-row:2}
  .baukasten{grid-column:1;grid-row:1}
  .kartenfeld{grid-column:2;grid-row:1 / span 2}
}
@media (max-width:760px){
  html,body{height:auto}
  .buehne{display:flex;flex-direction:column;height:auto}
  .kartenfeld{order:-1;height:58vh;min-height:340px}
  .spalte{overflow:visible}
  .raster{grid-template-columns:repeat(5,1fr)}
  .baukasten{order:0}.linienspalte{order:1}
}
@media (prefers-reduced-motion:no-preference){.hier-puls{animation:puls 1.6s ease-out infinite}}
@keyframes puls{from{opacity:.6}to{opacity:0}}

/* iPhone: Karte oben, Linien als Wischreihe, dann Route */
body{touch-action:manipulation}
@media (max-width:760px){
  :root{--text-normal:17px}
  .kopf{padding-block:10px}
  .kopf h1{font-size:20px}
  .kopf .zaehler{display:none}
  .kopf button{padding:10px 14px}
  .buehne{gap:var(--abstand-3);padding-block:var(--abstand-3)}
  .kartenfeld{order:0;height:52svh;min-height:300px}
  .linienspalte{order:1}
  .baukasten{order:2}
  .linienspalte .karte{padding:var(--abstand-3) 0}
  .linienspalte .label,.linienspalte .hinweis{padding-inline:var(--abstand-3)}
  .raster{display:flex;overflow-x:auto;gap:var(--abstand-2);padding:2px var(--abstand-3) 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .raster::-webkit-scrollbar{display:none}
  .kachel{flex:0 0 58px;height:58px;aspect-ratio:auto;scroll-snap-align:start}
  #raster-hinweis{margin-top:var(--abstand-2)!important}
  .karte{padding:var(--abstand-3)}
  .halt{min-height:44px;align-items:center}
  .auswahl{max-height:none}
  .knopf{min-height:46px}
  .legende{font-size:12px;gap:8px;left:8px;bottom:18px;padding:4px 8px}
  .legende span:nth-child(4){display:none}
  .leaflet-control-attribution{font-size:10px}
  .pin-name,.du b{font-size:14px}
  .vergleich{grid-template-columns:1fr 1fr}
}

/* Status, Menü, Leaderboard im ZVV-Stil */
[hidden]{display:none!important}
.status{display:flex;gap:var(--abstand-4);align-items:center;flex-wrap:wrap;background:var(--hintergrund);color:var(--text-dunkel);font-size:var(--text-klein);
  padding-block:var(--abstand-2);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status b{color:var(--zvv-blau);font-weight:600}
.status .zeit{margin-left:auto;font-weight:700;color:var(--stark);font-size:var(--text-normal);font-variant-numeric:tabular-nums}
.kopf button[hidden]{display:none}
.ohne-karte .kartenfeld{display:none!important}
.ohne-karte .buehne{display:flex;flex-wrap:wrap;align-items:flex-start}
.ohne-karte .spalte{flex:1 1 320px}
.menue{position:fixed;inset:0;background:var(--overlay);z-index:2000;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding-block:max(16px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menue-box{background:var(--karte);border-radius:var(--rund);width:min(660px,100%);margin-top:4vh;box-shadow:0 10px 32px rgba(0,0,0,.28);overflow:hidden}
.reiter{display:flex;background:var(--zvv-blau);padding:0 var(--abstand-3)}
.reiter button{background:none;border:0;color:var(--weiss);opacity:.75;padding:var(--abstand-4) var(--abstand-4) var(--abstand-3);font-size:var(--text-mittel);font-weight:600;border-bottom:4px solid transparent}
.reiter button.an{opacity:1;border-bottom-color:var(--weiss)}
.reiter button:hover{opacity:1}
.reiter .zu{margin-left:auto;font-size:30px;line-height:1;padding:var(--abstand-3) var(--abstand-2)}
.menue-inhalt{padding:var(--abstand-5)}
.menue-inhalt h2{font-size:28px;font-weight:600;color:var(--stark);margin:0 0 var(--abstand-3);line-height:1.15;text-wrap:balance}
.modusliste{display:flex;flex-direction:column;gap:var(--abstand-2)}
.modus{text-align:left;border:1.5px solid var(--linie);background:var(--karte);border-radius:var(--rund);padding:var(--abstand-3) var(--abstand-4);display:flex;flex-direction:column;gap:2px}
.modus b{color:var(--zvv-blau);font-size:var(--text-mittel);font-weight:600}
.modus span{font-size:var(--text-klein);color:var(--text)}
.modus:hover{border-color:var(--zvv-blau);background:var(--blau-hell)}
.modus.zweit{margin-top:var(--abstand-2);border-style:dashed}
.modus.voll{background:var(--zvv-blau);border-color:var(--zvv-blau)}
.modus.voll b,.modus.voll span{color:var(--weiss)}
.modus.voll:hover{background:var(--zvv-blau-dunkel)}
.zurueck-link{background:none;border:0;color:var(--zvv-blau);padding:0;margin-bottom:var(--abstand-2);font-weight:600;font-size:var(--text-klein)}
.chip{border:1.5px solid var(--linie);background:var(--karte);border-radius:999px;padding:3px 12px;font-size:15px;color:var(--text-dunkel)}
.chip:hover{border-color:var(--zvv-blau)}
.chip.an{background:var(--zvv-blau);border-color:var(--zvv-blau);color:var(--weiss)}
.gebiet-schnell{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:var(--abstand-3)}
.gebiet-schnell .hinweis{margin-left:auto}
.kreisliste{display:flex;flex-direction:column;gap:var(--abstand-3);margin:var(--abstand-3) 0 var(--abstand-4);max-height:44vh;overflow:auto;padding:var(--abstand-2);background:var(--hintergrund-hell);border-radius:var(--rund)}
.kreiskopf{font-weight:600;color:var(--stark);display:flex;align-items:center;gap:var(--abstand-2);cursor:pointer}
.kreiskopf input{width:18px;height:18px;accent-color:var(--zvv-blau)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 26px}
.einstellung{margin-bottom:var(--abstand-4)}
.segment{display:flex;flex-wrap:wrap;border:1.5px solid var(--zvv-blau);border-radius:var(--rund);overflow:hidden;width:fit-content;max-width:100%}

.regeln{padding-left:20px;margin:0 0 var(--abstand-4);display:flex;flex-direction:column;gap:6px;font-size:17px}
.name-form{display:flex;gap:var(--abstand-2);flex-wrap:wrap;margin-top:var(--abstand-3)}
.name-form input{flex:1 1 200px;font:inherit;padding:var(--abstand-2) var(--abstand-3);border:1.5px solid var(--linie);border-radius:var(--rund);background:var(--karte);color:var(--stark)}
.name-form input:focus{outline:2px solid var(--zvv-blau);border-color:var(--zvv-blau)}
.tabelle-wrap{overflow-x:auto}
.bestenliste{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.bestenliste th{text-align:left;font-size:var(--text-klein);color:var(--text-dunkel);border-bottom:2px solid var(--zvv-blau);padding:6px}
.bestenliste td{padding:var(--abstand-2) 6px;border-bottom:1px solid var(--linie);color:var(--stark)}
.bestenliste tr:first-child td{font-weight:700}
.bestenliste tr.ich td{background:var(--blau-hell)}
.segment.klein button{font-size:15px}
.schluss{margin-top:var(--abstand-3);padding:var(--abstand-3);background:var(--blau-hell);border-radius:var(--rund);text-align:center}
.meldung{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--stark);color:var(--karte);padding:var(--abstand-2) var(--abstand-4);border-radius:var(--rund);z-index:3000;font-size:var(--text-klein);max-width:calc(100% - 32px)}
@media (max-width:760px){
  .menue-box{margin-top:0}
  .menue-inhalt{padding:var(--abstand-4)}
  .menue-inhalt h2{font-size:24px}
  .reiter button{font-size:19px;padding:var(--abstand-3)}
  .kreisliste{max-height:none}
  .kopf h1{font-size:18px}
}

/* Vollbild-Menü wie die ZVV-Ticketkarte */
body.menue-offen{overflow:hidden}
.menue{display:block;background:linear-gradient(var(--zvv-blau) 0 92px,var(--hintergrund) 92px);padding:0}
.menue-box{width:min(620px,100%);margin:0 auto;background:none;box-shadow:none;border-radius:0;overflow:visible;
  padding-block:max(20px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mtitel{color:var(--weiss);font-size:var(--titel-klein);font-weight:600;margin:4px 4px 40px;letter-spacing:.01em}
.mkarte{background:var(--karte);border-radius:16px;box-shadow:0 2px 12px var(--schatten);overflow:hidden}
.mtabs{display:grid;grid-template-columns:1fr 1fr;background:var(--karte)}
.mtab{border:0;background:var(--zvv-blau);color:var(--weiss);font-weight:600;font-size:var(--text-mittel);padding:20px 12px 22px}
.mtab:first-child:not(.an){border-radius:0 16px 16px 0}
.mtab:last-child:not(.an){border-radius:16px 0 0 16px}
.mtab.an{background:var(--karte);color:var(--stark);cursor:default}
.mtab:not(.an):hover{background:var(--zvv-blau-dunkel)}
.mkoerper{padding:26px 30px 0}
.mlabel{font-weight:600;color:var(--stark);font-size:var(--text-normal)}
.mlabel.blau{color:var(--zvv-blau);font-size:var(--text-klein);display:block}
.mwert{background:none;border:0;padding:4px 0 0;color:var(--zvv-blau);font-size:30px;font-weight:600;display:flex;align-items:center;gap:12px;text-align:left}
.mwert.ohne{cursor:default}
.mstift svg{width:24px;height:24px;display:block}
.mkopf .hinweis{margin-top:6px}
.mkacheln{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 30px}
.mkacheln.zwei{grid-template-columns:repeat(2,1fr)}
.mkachel{aspect-ratio:1;border:0;border-radius:8px;background:var(--zvv-blau);color:var(--weiss);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.mkachel b{font-size:26px;font-weight:600;line-height:1.1}
.mkachel small{font-size:14px;opacity:.92;line-height:1.2}
.mkachel:hover{background:var(--zvv-blau-dunkel)}
.mkacheln.zwei .mkachel{aspect-ratio:auto;min-height:140px}
.mzeilen{margin:0 -30px}
.mzeile{display:flex;align-items:center;gap:18px;width:100%;border:0;border-top:1px solid var(--linie);background:none;padding:22px 30px;text-align:left;font-size:var(--text-mittel);color:var(--stark)}
.mzeile:hover{background:var(--hintergrund-hell)}
.mzeile-icon{color:var(--zvv-blau);width:40px;height:40px;flex:none}
.mzeile-icon svg,.mzeile-pfeil svg{width:100%;height:100%;display:block}
.mzeile-text{flex:1}
.mzeile-pfeil{color:var(--text);width:20px;height:20px}
.minhalt{padding-bottom:26px}
.minhalt h2{font-size:28px;font-weight:600;color:var(--stark);margin:8px 0 10px;line-height:1.15;text-wrap:balance}
.mzurueck{background:none;border:0;padding:0;color:var(--zvv-blau);font-weight:600;font-size:var(--text-normal)}
.mknopf{width:100%;margin-top:8px;border:0;border-radius:8px;background:var(--zvv-blau);color:var(--weiss);font-weight:600;font-size:var(--text-mittel);padding:16px}
.mknopf:hover{background:var(--zvv-blau-dunkel)}
.mfeld{display:block;background:var(--karte);border:1.5px solid var(--linie);border-radius:8px;padding:12px 16px;margin:14px 0 8px}
.mfeld:focus-within{border-color:var(--zvv-blau)}
.mfeld input{display:block;width:100%;border:0;outline:0;font:inherit;font-size:24px;color:var(--stark);background:none;padding:2px 0 0}
.mfuss{text-align:center;color:var(--text);font-size:var(--text-klein);margin:18px 0 0}
.einstellung .mlabel{margin-bottom:6px}
.minhalt .kreisliste{max-height:none}
@media (max-width:760px){
  .menue{background:linear-gradient(var(--zvv-blau) 0 72px,var(--hintergrund) 72px)}
  .mtitel{font-size:24px;margin:0 4px 34px}
  .mkoerper{padding:22px 18px 0}
  .mzeilen{margin:0 -18px}
  .mzeile{padding:18px}
  .mtab{font-size:19px;padding:16px 8px 18px}
  .mkacheln{gap:10px;margin:20px 0 24px}
  .mkachel b{font-size:20px}
  .mkachel small{font-size:12px}
  .mwert{font-size:24px}
  .minhalt h2{font-size:24px}
}

/* Reiter wie bei ZVV: aktiver Reiter weiss mit runden Ecken oben, inaktiver blau mit runder Ecke zum Inhalt */
.mkarte{background:transparent;box-shadow:none;overflow:visible;filter:drop-shadow(0 2px 6px rgba(0,0,0,.10))}
.mtabs{background:linear-gradient(transparent 0 50%,var(--karte) 50%)}
.mtab{border-radius:16px 16px 0 0}
.mtab.an{border-radius:16px 16px 0 0}
.mtab:first-child:not(.an){border-radius:16px 16px 16px 0}
.mtab:last-child:not(.an){border-radius:16px 16px 0 16px}
.mkoerper{background:var(--karte);border-radius:0 0 16px 16px}
.mzeilen{border-radius:0 0 16px 16px;overflow:hidden}
.mkacheln.oben{margin-top:4px}

/* Reiter exakt wie ZVV: hinter der runden Ecke des weissen Reiters liegt Blau, die runde Ecke des blauen Reiters zeigt Weiss */
.mkarte{background:var(--karte);border-radius:16px;overflow:hidden;filter:none;box-shadow:0 2px 12px var(--schatten)}
.mtabs{background:linear-gradient(to right,var(--zvv-blau) 50%,var(--karte) 50%)}
.mtabs.rechts{background:linear-gradient(to right,var(--karte) 50%,var(--zvv-blau) 50%)}
.mtab,.mtab.an,.mtab:first-child:not(.an),.mtab:last-child:not(.an){border-radius:0}
.mtab:first-child.an{border-radius:0 18px 0 0}
.mtab:last-child:not(.an){border-radius:0 0 0 18px}
.mtab:last-child.an{border-radius:18px 0 0 0}
.mtab:first-child:not(.an){border-radius:0 0 18px 0}
.mkoerper,.mzeilen{border-radius:0}
.mzeile-icon svg,.mstift svg,.kachel svg,.badge svg{shape-rendering:geometricPrecision}
.mit-info{display:flex;align-items:center;gap:8px}
.info-knopf{width:24px;height:24px;border-radius:50%;border:2px solid var(--zvv-blau);background:var(--karte);color:var(--zvv-blau);font-weight:700;font-size:14px;line-height:1;padding:0;font-style:italic;font-family:Georgia,serif}
.info-knopf[aria-expanded="true"]{background:var(--zvv-blau);color:var(--weiss)}
.infobox{background:var(--hintergrund-hell);border:1px solid var(--linie);border-radius:8px;padding:12px 14px;margin:8px 0 12px;display:flex;flex-direction:column;gap:12px}
.infozeile b{display:block;color:var(--stark);font-weight:600}
.infozeile > span{display:block;font-size:var(--text-klein);color:var(--text);margin-bottom:6px}
.infobadges{display:flex;flex-wrap:wrap;gap:5px}
.infobadges .badge{min-width:34px;height:24px;font-size:15px}
.segment.stapel{flex-direction:column;width:100%}
.segment.stapel button{border-right:0;border-bottom:1.5px solid var(--zvv-blau);text-align:left;padding:10px 14px;display:flex;align-items:center;gap:10px}
.segment.stapel button:last-child{border-bottom:0}
.segment.stapel button::before{content:"";width:18px;height:18px;border-radius:4px;border:2px solid currentColor;flex:none;box-sizing:border-box}
.segment.stapel button.an::before{background:currentColor;box-shadow:inset 0 0 0 3px var(--zvv-blau)}
/* Menü-Leiste gleich wie im Spiel */
.menue{background:var(--hintergrund)}
@media (max-width:760px){.menue{background:var(--hintergrund)}}
.menue .kopf{position:sticky;top:0;z-index:5}
.menue-box{padding-block:28px 40px}
.spielname{letter-spacing:.02em}
.spielname{display:flex;align-items:center;line-height:0}
.spielname .logo{height:40px;width:auto;display:block}
.kopf{min-height:58px}
@media (max-width:760px){.spielname .logo{height:30px}}
/* Beim Darüberfahren auch die Ecke hinter dem weissen Reiter dunkler färben */
.mtabs:has(.mtab:not(.an):hover),.mtabs:has(.mtab:not(.an):active){background:linear-gradient(to right,var(--zvv-blau-dunkel) 50%,var(--karte) 50%)}
.mtabs.rechts:has(.mtab:not(.an):hover),.mtabs.rechts:has(.mtab:not(.an):active){background:linear-gradient(to right,var(--karte) 50%,var(--zvv-blau-dunkel) 50%)}
.mtab:not(.an):active{background:var(--zvv-blau-dunkel)}
.richtungen{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 6px}
.richtung-knopf{border:1.5px solid var(--zvv-blau);background:var(--karte);color:var(--zvv-blau);border-radius:var(--rund);padding:8px 10px;text-align:left;font-weight:600;font-size:16px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.richtung-knopf small{display:block;font-weight:500;font-size:12px;opacity:.85}
.richtung-knopf.an{background:var(--zvv-blau);color:var(--weiss)}
.auswahl h3{position:sticky;top:0;background:var(--karte);padding:6px 0 4px;margin:10px 0 2px;color:var(--zvv-blau);font-size:15px;z-index:1}
.mit-info{display:flex;align-items:center;gap:8px}
.label.mit-info .info-knopf,.info-knopf{text-transform:none;letter-spacing:0;flex:none}
.infobox p{margin:0;font-size:var(--text-klein);color:var(--text-dunkel);line-height:1.45}
.mschwierig{margin-top:18px}
.mkacheln{margin-top:12px}
.resultat .infobox{text-align:left}
</style>
</head>

<script>
(() => {
const D = JSON.parse(document.getElementById("daten").textContent);
const NS = "http://www.w3.org/2000/svg";
const WARTEN = 3, FUSS_MAX = 700, UMWEG = 1.3, TEMPO = 75;   // Minuten, Meter, Meter pro Minute
const FUSS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="4.2" r="2" fill="currentColor" stroke="none"/><path d="M12.6 8.2l-1.9 6.3 3.3 3.1V21"/><path d="M10.7 14.5L8.4 21"/><path d="M8 12.2l1.6-3.3 3-.7 2.2 2.6 2.7 1.1"/></svg>';
const KREISFARBE = {1:"a",2:"b",3:"c",4:"d",5:"b",6:"c",7:"b",8:"d",9:"a",10:"d",11:"a",12:"d"};

// ---------- Netz vorbereiten ----------
const STOPS = new Map();
for (const [id, name, lat, lon, x, y, sp, kreis, quartier] of D.stops) STOPS.set(id, { id, name, lat, lon, x, y, spielbar: !!sp, kreis, quartier });
const EDGES = D.edges.map(([line, dir, a, b, min, pts]) => ({ line, dir, a, b, min, pts }));
const AUS = new Map();
for (const e of EDGES) { if (!AUS.has(e.a)) AUS.set(e.a, []); AUS.get(e.a).push(e); }
const istTram = nr => (D.linien[nr] || {}).art === "tram";
const sortLinie = (a, b) => (istTram(b) - istTram(a)) || (parseInt(a) - parseInt(b)) || a.localeCompare(b);
const linienAn = id => [...new Set((AUS.get(id) || []).map(e => e.line))].sort(sortLinie);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fussMin = (a, b) => Math.max(1, Math.round(dist(a, b) * UMWEG / TEMPO));
const NAH = new Map();   // Haltestellen in Gehdistanz
for (const a of STOPS.values()) {
  const n = [];
  for (const b of STOPS.values()) if (a !== b && dist(a, b) <= FUSS_MAX) n.push(b.id);
  NAH.set(a.id, n.sort((x, y) => dist(a, STOPS.get(x)) - dist(a, STOPS.get(y))));
}
function farbe(nr) {
  const [bg, fg] = String((D.linien[nr] || {}).f || "").split("~");
  return bg ? { bg: "#" + bg, fg: "#" + fg, strich: "#" + bg, rand: false }
            : { bg: "#ffffff", fg: "#13202d", strich: getComputedStyle(document.documentElement).getPropertyValue("--bus-strich").trim(), rand: true };
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function badge(nr) {
  if (nr === "fuss") return `<span class="badge fussb" title="Zu Fuss">${FUSS_SVG}</span>`;
  const f = farbe(nr);
  return `<span class="badge ${istTram(nr) ? "tram" : "bus"}${f.rand ? " rand" : ""}" style="--bg-l:${f.bg};--fg-l:${f.fg}">${esc(nr)}</span>`;
}

// Kleine Prioritätswarteschlange für die Wegsuche
class Heap { constructor() { this.a = []; }
  push(k, v) { const a = this.a; a.push([k, v]); let i = a.length - 1;
    while (i) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; } }
  pop() { const a = this.a, top = a[0], last = a.pop();
    if (a.length) { a[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
      if (l < a.length && a[l][0] < a[m][0]) m = l; if (r < a.length && a[r][0] < a[m][0]) m = r;
      if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m; } } return top; }
  get size() { return this.a.length; } }

// Wohin komme ich mit Linie L ab Haltestelle A? (pro Fahrtrichtung)
function fahrtZiele(A, L) {
  const gruppen = [];
  for (const dir of [0, 1]) {
    const best = new Map([[A, { min: 0, kante: null }]]), h = new Heap(); h.push(0, A);
    while (h.size) {
      const [k, s] = h.pop(); if (k > best.get(s).min) continue;
      for (const e of AUS.get(s) || []) {
        if (e.line !== L || e.dir !== dir) continue;
        const n = k + e.min;
        if (!best.has(e.b) || n < best.get(e.b).min) { best.set(e.b, { min: n, kante: e }); h.push(n, e.b); }
      }
    }
    best.delete(A);
    if (!best.size) continue;
    const halte = [...best.entries()].sort((x, y) => x[1].min - y[1].min);
    gruppen.push({ dir, endstation: STOPS.get(halte[halte.length - 1][0]).name, halte, best });
  }
  return gruppen;
}
function wegLinie(gruppe, ziel, A) {
  const kanten = []; let s = ziel;
  while (s !== A) { const k = gruppe.best.get(s).kante; kanten.unshift(k); s = k.a; }
  return kanten;
}

// Schnellste Route (gleiche Regeln wie für dich: 3 min Warten pro Einsteigen, Gehen 75 m/min mit Umwegen)
// ---------- Einstellungen, Gruppen, Gebiete ----------
const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2, "0");
const gruppeVon = L => (istTram(L) || !farbe(L).rand) ? 1 : 2;   // 1 = Tram und farbige Busse, 2 = weisse Busse, 3 = Laufen

// Zufallszahlen mit festem Startwert: gleiche Tages-Challenge für alle
function zufallAus(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const heute = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const uhr = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`; };

// Schnellster Weg mit den erlaubten Gruppen
function schnellste(startId, zielId, gr = CFG.gruppen) {
  const key = (s, l) => s + "|" + l, best = new Map(), von = new Map(), h = new Heap();
  best.set(key(startId, ""), 0); h.push(0, [startId, ""]);
  const weiter = (s, l, n, wie) => { const kk = key(s, l);
    if (!best.has(kk) || n < best.get(kk)) { best.set(kk, n); von.set(kk, wie); h.push(n, [s, l]); } };
  const laufen = darfLaufen(gr);
  while (h.size) {
    const [k, [s, l]] = h.pop(); const kk = key(s, l);
    if (k > best.get(kk)) continue;
    if (s === zielId && l === "") break;
    if (l === "") {
      for (const Ln of linienHier(s, gr)) weiter(s, Ln, k + WARTEN, { s, l, art: "ein" });
      if (laufen) for (const n of NAH.get(s)) weiter(n, "", k + fussMin(STOPS.get(s), STOPS.get(n)), { s, l, art: "fuss" });
    } else {
      weiter(s, "", k, { s, l, art: "aus" });
      for (const e of AUS.get(s) || []) if (e.line === l) weiter(e.b, l, k + e.min, { s, l, art: "fahrt", e });
    }
  }
  const ende = key(zielId, "");
  if (!best.has(ende)) return null;
  const schritte = []; let kk = ende;
  while (von.has(kk)) { const w = von.get(kk); schritte.unshift({ ...w, nach: kk }); kk = key(w.s, w.l); }
  const legs = [];
  for (const st of schritte) {
    if (st.art === "fuss") { const [n] = st.nach.split("|"); legs.push({ art: "fuss", von: st.s, bis: +n }); }
    if (st.art === "ein") legs.push({ art: "fahrt", line: st.nach.split("|")[1], von: st.s, bis: st.s, kanten: [] });
    if (st.art === "fahrt") { const leg = legs[legs.length - 1]; leg.kanten.push(st.e); leg.bis = st.e.b; }
  }
  return { min: best.get(ende), legs };
}
const legMin = leg => leg.art === "fuss" ? fussMin(STOPS.get(leg.von), STOPS.get(leg.bis))
                                        : WARTEN + leg.kanten.reduce((s, e) => s + e.min, 0);
const fahrten = r => r.legs.filter(l => l.art === "fahrt").length;

function streckeSuchen({ gebiet, gruppen, zufall = Math.random, umstiege = null, minDist = 2500, versuche = 250 }) {
  const pool = [...STOPS.values()].filter(s => gebiet.has(s.quartier) && linienHier(s.id, gruppen).length);
  if (pool.length < 2) return null;
  let notfall = null;
  for (let v = 0; v < versuche; v++) {
    const a = pool[Math.floor(zufall() * pool.length)], b = pool[Math.floor(zufall() * pool.length)];
    if (a === b || a.name === b.name || dist(a, b) < minDist) continue;
    const beste = schnellste(a.id, b.id, gruppen);
    if (!beste || !fahrten(beste) || beste.min < 10) continue;
    const r = { start: a.id, ziel: b.id, beste };
    if (umstiege === null) return r;
    if (fahrten(beste) - 1 === umstiege && beste.min <= 50) return r;
    if (!notfall) notfall = r;
  }
  if (notfall) return notfall;
  return minDist > 800 ? streckeSuchen({ gebiet, gruppen, zufall, umstiege, minDist: Math.round(minDist / 2), versuche }) : null;
}

// ---------- Spielzustand ----------
let S = null;
function rundeStarten(r) {
  S = { ...r, ort: r.start, legs: [], modus: null, linie: null, gruppen: [], fertig: false, aufgegeben: false, startMs: Date.now(), endMs: null };
  zeichneAlles(); aufRundeZoomen();
}
function neueRunde() {
  if (CFG.comp) return;
  const r = streckeSuchen({ gebiet: CFG.gebiet, gruppen: CFG.gruppen });
  if (!r) { zeigeMeldung("In diesem Gebiet finde ich keine Strecke. Wähl mehr Quartiere oder mehr Verkehrsmittel."); menueOeffnen(); return; }
  rundeStarten(r);
}
const ort = () => STOPS.get(S.ort);

function linieWaehlen(L) {
  if (S.fertig) return;
  if (S.linie === L) { S.modus = null; S.linie = null; S.gruppen = []; }
  else if (L === "fuss") { if (!darfLaufen()) return; S.modus = "fuss"; S.linie = "fuss"; S.gruppen = []; }
  else { if (!darfLinie(L)) return; S.modus = "fahrt"; S.linie = L; S.gruppen = fahrtZiele(S.ort, L); S.richtungWahl = 0; }
  zeichneAlles();
}
function zielWaehlen(id) {
  if (S.modus === "fahrt") {
    const g = S.gruppen.find(g => g.best.has(id)); if (!g) return;
    S.legs.push({ art: "fahrt", line: S.linie, von: S.ort, bis: id, kanten: wegLinie(g, id, S.ort) });
  } else if (S.modus === "fuss") {
    if (!NAH.get(S.ort).includes(id)) return;
    S.legs.push({ art: "fuss", von: S.ort, bis: id });
  } else return;
  S.ort = id; S.modus = null; S.linie = null; S.gruppen = [];
  if (id === S.ziel) beenden();
  zeichneAlles();
}
function zurueck() {
  if (!S.legs.length || S.fertig) return;
  const leg = S.legs.pop(); S.ort = leg.von; S.modus = null; S.linie = null; S.gruppen = [];
  zeichneAlles();
}
const meineMin = () => S.legs.reduce((s, l) => s + legMin(l), 0);
const rundenPunkte = () => S.aufgegeben ? 0 : Math.min(100, Math.round(100 * S.beste.min / Math.max(meineMin(), 0.1)));
function beenden(aufgegeben) {
  S.fertig = true; S.aufgegeben = !!aufgegeben; S.modus = null; S.linie = null; S.gruppen = []; S.endMs = Date.now();
  if (CFG.comp) {
    CFG.comp.punkte.push(rundenPunkte());
    if (CFG.comp.punkte.length === 5) { CFG.comp.endMs = Date.now(); compAbschliessen(); }
  } else if (!aufgegeben) {
    const st = lesen("tramrennen-netz", {}), diff = Math.round(meineMin() - S.beste.min);
    st.runden = (st.runden || 0) + 1; if (diff <= 0) st.perfekt = (st.perfekt || 0) + 1; schreiben("tramrennen-netz", st);
  }
}

const COMP_GRUPPEN = [[1], [1], [1, 2], [1, 3], [1, 2, 3]];
function compStarten(name) {
  const tag = heute();
  CFG = { karte: "mittel", gruppen: COMP_GRUPPEN[0], gebiet: new Set(ALLE_QUARTIERE), aufZeit: true,
          comp: { name, tag, index: 0, punkte: [], startMs: Date.now(), endMs: null, eingetragen: false } };
  compRunde();
}
function compRunde() {
  const c = CFG.comp, i = c.index;
  CFG.gruppen = COMP_GRUPPEN[i];
  const r = streckeSuchen({ gebiet: CFG.gebiet, gruppen: CFG.gruppen, umstiege: 2, minDist: 3000, versuche: 400 });
  rundeStarten(r);
}
function compWeiter() { CFG.comp.index++; compRunde(); }
async function compAbschliessen() {
  const c = CFG.comp;
  const eintrag = { name: c.name, punkte: c.punkte.reduce((a, b) => a + b, 0), zeit_s: Math.round((c.endMs - c.startMs) / 1000), tag: c.tag };
  c.ergebnis = eintrag;
  c.status = await blEintragen(eintrag);
  c.eingetragen = true;
  zeichneErgebnis();
}

  let h = `<div class="gebiet-schnell"><button type="button" class="chip" data-m="gebiet-alle">Ganze Stadt</button><button type="button" class="chip" data-m="gebiet-keine">Keine</button><span class="hinweis">${g.size} von ${QUARTIERE.size}</span></div><div class="kreisliste">`;
  for (const k of KREISE) {
    const qs = [...QUARTIERE].filter(([, kk]) => kk === k).map(([q]) => q).sort((a, b) => a.localeCompare(b, "de"));
    const an = qs.filter(q => g.has(q)).length;
    h += `<div class="kreisgruppe"><label class="kreiskopf"><input type="checkbox" data-m="kreis" data-kreis="${k}" ${an === qs.length ? "checked" : ""} ${an && an < qs.length ? 'data-halb="1"' : ""}> Kreis ${k}</label><div class="chips">`
      + qs.map(q => `<button type="button" class="chip${g.has(q) ? " an" : ""}" aria-pressed="${g.has(q)}" data-m="quartier" data-q="${esc(q)}">${esc(q)}</button>`).join("")
      + `</div></div>`;
  }
  return h + `</div>`;
}
const zeile = (m, icon, text, extra = "") => `<button class="mzeile" data-m="${m}"${extra}><span class="mzeile-icon">${ICON[icon]}</span><span class="mzeile-text">${text}</span><span class="mzeile-pfeil">${ICON.pfeil}</span></button>`;
const zurueckZeile = `<button class="mzurueck" data-m="start">‹ Zurück</button>`;
const segment = (m, attr, optionen, aktiv) => `<div class="segment">` + optionen.map(([wert, text]) =>
  `<button class="${aktiv(wert) ? "an" : ""}" aria-pressed="${aktiv(wert)}" data-m="${m}" data-${attr}="${wert}">${text}</button>`).join("") + `</div>`;

function zeichneMenue() {
  const w = M.wahl;
  const tabs = `<div class="mtabs${M.tab === "comp" ? " rechts" : ""}" role="tablist">
    <button role="tab" class="mtab${M.tab === "normal" ? " an" : ""}" aria-selected="${M.tab === "normal"}" data-m="tab" data-tab="normal">Normal</button>
    <button role="tab" class="mtab${M.tab === "comp" ? " an" : ""}" aria-selected="${M.tab === "comp"}" data-m="tab" data-tab="comp">Competitive</button></div>`;
  let h = "";
  if (M.tab === "normal" && M.ansicht === "start") {
    h = `<div class="mkopf"><div class="mlabel mit-info">Gebiet für Start und Ziel ${infoKnopf("gebiet")}</div>
        ${M.info === "gebiet" ? infoInhalt("gebiet") : ""}
        <button class="mwert" data-m="gebiet-nur">${gebietText(w.gebiet)} <span class="mstift">${ICON.stift}</span></button></div>
      <div class="mlabel mit-info mschwierig">Schwierigkeit ${infoKnopf("modus")}</div>${M.info === "modus" ? infoInhalt("modus") : ""}
      <div class="mkacheln">
        <button class="mkachel" data-m="modus" data-karte="einfach"><b>Einfach</b><small>Karte mit allen Haltestellen</small></button>
        <button class="mkachel" data-m="modus" data-karte="mittel"><b>Mittel</b><small>Karte nur mit deinem Weg</small></button>
        <button class="mkachel" data-m="modus" data-karte="schwer"><b>Schwer</b><small>Ohne Karte</small></button></div>
      <div class="mzeilen">${zeile("eigen", "regler", "Benutzerdefiniert")}${S && !S.fertig && !CFG.comp ? zeile("weiter-spielen", "verlauf", "Weiterspielen") : ""}</div>`;
  } else if (M.tab === "normal" && (M.ansicht === "gebiet" || M.ansicht === "gebiet-nur")) {
    const nurGebiet = M.ansicht === "gebiet-nur";
    h = `<div class="minhalt">${zurueckZeile}<h2>Welche Kreise und Quartiere möchtest du?</h2>
      <p class="hinweis">Start und Ziel liegen nur hier. Durchfahren darfst du überall.${nurGebiet ? "" : ` Modus: <b>${KARTEN_NAME[w.karte]}</b>`}</p>
      ${gebietWaehler()}<button class="mknopf" data-m="${nurGebiet ? "start" : "los"}">${nurGebiet ? "Übernehmen" : "Spielen"}</button></div>`;
  } else if (M.tab === "normal" && M.ansicht === "eigen") {
    h = `<div class="minhalt">${zurueckZeile}<h2>Benutzerdefiniert</h2>
      <div class="einstellung"><div class="mlabel mit-info">Karte ${infoKnopf("modus")}</div>${M.info === "modus" ? infoInhalt("modus") : ""}${segment("karte", "karte", [["einfach", "Einfach"], ["mittel", "Mittel"], ["schwer", "Schwer"]], v => w.karte === v)}</div>
      <div class="einstellung"><div class="mlabel mit-info">Verkehrsmittel ${infoKnopf("gruppen")}</div>${M.info === "gruppen" ? infoInhalt("gruppen") : ""}${segment("gruppe", "g", [[1, GRUPPEN_NAME[1]], [2, GRUPPEN_NAME[2]], [3, GRUPPEN_NAME[3]]], v => w.gruppen.includes(+v)).replace('class="segment"', 'class="segment stapel"')}</div>
      <div class="einstellung"><div class="mlabel mit-info">Auf Zeit ${infoKnopf("zeit")}</div>${M.info === "zeit" ? infoInhalt("zeit") : ""}${segment("zeit", "zeit", [[0, "Ohne Uhr"], [1, "Mit Uhr"]], v => w.aufZeit === (v === 1))}</div>
      <div class="einstellung"><div class="mlabel mit-info">Kreise und Quartiere ${infoKnopf("gebiet")}</div>${M.info === "gebiet" ? infoInhalt("gebiet") : ""}${gebietWaehler()}</div>
      <button class="mknopf" data-m="los">Spielen</button></div>`;
  } else if (M.tab === "comp" && M.ansicht === "start") {
    h = `<div class="mkacheln zwei oben">
        <button class="mkachel" data-m="comp-name"><b>Spielen</b><small>5 Runden · max. 500 Punkte</small></button>
        <button class="mkachel" data-m="board"><b>Leaderboard</b><small>Die Besten</small></button></div>
      <div class="mzeilen">${zeile("regeln", "regeln", "So funktioniert's")}${CFG.comp && S && !(CFG.comp.punkte.length === 5) ? zeile("weiter-spielen", "verlauf", "Weiterspielen") : ""}</div>`;
  } else if (M.tab === "comp" && M.ansicht === "regeln") {
    h = `<div class="minhalt">${zurueckZeile}<h2>So funktioniert's</h2><ul class="regeln">
        <li>5 Runden, pro Runde höchstens 100 Punkte, total 500.</li>
        <li>Ganz Zürich, alle Kreise und Quartiere. Der schnellste Weg hat immer 2 Umstiege.</li>
        <li>Runde 1 und 2: nur Tram und Hauptbuslinien. Runde 3: plus Quartierbusse. Runde 4: plus zu Fuss. Runde 5: alles.</li>
        <li>Punkte: 100 × schnellster Weg ÷ dein Weg. Aufgeben gibt 0 Punkte.</li>
        <li>Karte im Modus Mittel. Die Uhr läuft. Bei gleich vielen Punkten gewinnt, wer schneller war.</li>
</ul>${infoBox()}
      <button class="mknopf" data-m="comp-name">Spielen</button></div>`;
  } else if (M.tab === "comp" && M.ansicht === "name") {
    h = `<div class="minhalt">${zurueckZeile}<h2>Wie heisst du?</h2>
      <form id="name-form" class="mfeld-form"><label class="mfeld"><span class="mlabel blau">Name im Leaderboard</span>
        <input id="spielername" maxlength="20" autocomplete="nickname" placeholder="Spitzname" value="${esc(lesen("tramrennen-name", ""))}" required></label>
        <p class="hinweis">${online() ? "Alle können diesen Namen sehen. Nimm lieber einen Spitznamen als deinen vollen Namen." : "Der Name wird auf diesem Gerät gespeichert."}</p>
        <button class="mknopf" type="submit">Los geht's</button></form></div>`;
  } else if (M.tab === "comp" && M.ansicht === "board") {
    h = `<div class="minhalt">${zurueckZeile}<h2 class="mit-info">Leaderboard ${infoKnopf("leaderboard")}</h2>${M.info === "leaderboard" ? infoInhalt("leaderboard") : ""}
      ${segment("boardtag", "tag", [["heute", "Heute"], ["alle", "Alle Tage"]], v => M.boardTag === v)}`;
    const b = M.board;
    if (!b) h += `<p class="hinweis" style="margin-top:12px">Wird geladen …</p>`;
    else {
      h += `<p class="hinweis" style="margin:10px 0">${b.online ? "Alle Spielerinnen und Spieler." : "Nur die Runden auf diesem Gerät. Das Online-Leaderboard ist hier nicht erreichbar."}</p>`;
      h += b.liste.length ? `<div class="tabelle-wrap"><table class="bestenliste"><thead><tr><th>#</th><th>Name</th><th>Punkte</th><th>Zeit</th>${M.boardTag === "alle" ? "<th>Tag</th>" : ""}</tr></thead><tbody>`
        + b.liste.map((e, i) => `<tr${CFG.comp && CFG.comp.ergebnis && e.name === CFG.comp.ergebnis.name && e.punkte === CFG.comp.ergebnis.punkte && e.zeit_s === CFG.comp.ergebnis.zeit_s ? ' class="ich"' : ""}><td>${i + 1}</td><td>${esc(e.name)}</td><td>${e.punkte}</td><td>${uhr(e.zeit_s * 1000)}</td>${M.boardTag === "alle" ? `<td>${esc(String(e.tag).split("-").reverse().join("."))}</td>` : ""}</tr>`).join("")
        + `</tbody></table></div>` : `<p class="hinweis">Noch niemand hat gespielt. Sei die oder der Erste!</p>`;
    }
    h += `<button class="mknopf" data-m="comp-name" style="margin-top:16px">Spielen</button></div>`;
  }
  $("menue-box").innerHTML = `<div class="mkarte">${tabs}<div class="mkoerper">${h}</div></div>
    <p class="mfuss">Ein Spiel mit dem Zürcher Liniennetz. Keine offizielle App von ZVV oder VBZ.</p>`;
  $("menue-box").querySelectorAll('input[data-halb]').forEach(i => i.indeterminate = true);
  const f = $("name-form");
  if (f) { f.onsubmit = e => { e.preventDefault(); const n = $("spielername").value.trim().slice(0, 20); if (!n) return; schreiben("tramrennen-name", n); menueZu(); compStarten(n); }; setTimeout(() => $("spielername").focus(), 30); }
}
async function ladeBoard() { M.board = null; zeichneMenue(); M.board = await blLaden(M.boardTag === "heute" ? heute() : null); if (M.ansicht === "board") zeichneMenue(); }
function wahlSpeichern() { schreiben("tramrennen-wahl2", { gruppen: M.wahl.gruppen, aufZeit: M.wahl.aufZeit, gebiet: [...M.wahl.gebiet] }); }

$("menue").addEventListener("click", e => {
  const t = e.target.closest("[data-m]"); if (!t) return;
  const a = t.dataset.m, w = M.wahl;
  if (a === "tab") { M.tab = t.dataset.tab; M.ansicht = "start"; }
  else if (a === "start") { M.ansicht = "start"; wahlSpeichern(); }
  else if (a === "gebiet-nur") M.ansicht = "gebiet-nur";
  else if (a === "modus") { w.karte = t.dataset.karte; M.ansicht = "gebiet"; }
  else if (a === "eigen") M.ansicht = "eigen";
  else if (a === "weiter-spielen") { menueZu(); return; }
  else if (a === "karte") w.karte = t.dataset.karte;
  else if (a === "gruppe") { const g = +t.dataset.g; w.gruppen = w.gruppen.includes(g) ? w.gruppen.filter(x => x !== g) : [...w.gruppen, g].sort(); }
  else if (a === "zeit") w.aufZeit = t.dataset.zeit === "1";
  else if (a === "quartier") { const q = t.dataset.q; w.gebiet.has(q) ? w.gebiet.delete(q) : w.gebiet.add(q); }
  else if (a === "kreis") { const k = +t.dataset.kreis, qs = [...QUARTIERE].filter(([, kk]) => kk === k).map(([q]) => q);
    const alle = qs.every(q => w.gebiet.has(q)); qs.forEach(q => alle ? w.gebiet.delete(q) : w.gebiet.add(q)); }
  else if (a === "gebiet-standard") w.gebiet = new Set(STANDARD_GEBIET);
  else if (a === "gebiet-alle") w.gebiet = new Set(ALLE_QUARTIERE);
  else if (a === "gebiet-keine") w.gebiet = new Set();
  else if (a === "los") {
    const gr = M.ansicht === "eigen" ? w.gruppen : [1, 2, 3], zeit = M.ansicht === "eigen" ? w.aufZeit : false;
    if (!gr.some(g => g !== 3)) { zeigeMeldung("Wähl mindestens Tram und farbige Busse oder weisse Busse."); return; }
    if (w.gebiet.size < 1) { zeigeMeldung("Wähl mindestens ein Quartier."); return; }
    CFG = { karte: w.karte, gruppen: gr, gebiet: new Set(w.gebiet), aufZeit: zeit, comp: null };
    wahlSpeichern(); menueZu(); neueRunde(); return;
  }
  else if (a === "regeln") M.ansicht = "regeln";
  else if (a === "info") M.info = M.info === t.dataset.info ? null : t.dataset.info;
  else if (a === "comp-name") M.ansicht = "name";
  else if (a === "board") { M.ansicht = "board"; ladeBoard(); return; }
  else if (a === "boardtag") { M.boardTag = t.dataset.tag; ladeBoard(); return; }
  zeichneMenue();
});

neueRunde();
menueOeffnen("normal");
})();
</script>

</body>
</html>
